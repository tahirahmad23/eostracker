version: '3.8'

services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: eos_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eos_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Application container (for running migrations, seeds, tests)
  web:
    build: .
    container_name: eos_tracker_web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eos_tracker
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount current directory to /app in container
      - .:/app
    working_dir: /app
    command: sleep infinity  # Keep container running for manual commands

volumes:
  postgres_data:






