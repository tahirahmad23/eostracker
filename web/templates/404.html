{% extends "base.html" %}

{% block title %}Page Not Found - EOS Tracker{% endblock %}

        <div class="mb-8">
            <svg class="mx-auto h-24 w-24 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">

        <a href="/" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 transition shadow-sm">

        </a>
    </div>
