{% extends "base.html" %}

{% block title %}Add Device - EOS Tracker{% endblock %}

{% block content %}
<div class="py-10">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <header class="mb-8">
            <h1 class="text-2xl font-semibold text-neutral-900">Add Device to Tracking</h1>
            <p class="mt-1 text-sm text-neutral-600">Select a device from our database to start tracking</p>
        </header>
        
        <div class="bg-white border border-neutral-200 rounded-lg shadow-sm">
            <form action="/tracking/add" method="POST" class="p-6 space-y-6">
                <div>
                    <label for="device_id" class="block text-sm font-medium text-neutral-700 mb-1">Select Device</label>
                    <select id="device_id" name="device_id" required placeholder="Start typing (e.g. Cisco, Juniper...)" autocomplete="off">
                        <option value="">Choose a device...</option>
                        {% for device in devices %}
                        <option value="{{ device.id }}">
                        {{ device.vendor }} {{ device.model }} (EOS: {{ device.eos_date }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="custom_name" class="block text-sm font-medium text-neutral-700 mb-1">Custom Name (Optional)</label>
                    <input type="text" name="custom_name" id="custom_name" class="block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition" placeholder="My Production Router">
                    <p class="mt-2 text-sm text-neutral-600">Give this device a memorable name</p>
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-neutral-700 mb-1">Notes (Optional)</label>
                    <textarea id="notes" name="notes" rows="3" class="block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition" placeholder="Location, criticality, or other notes..."></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-neutral-200">
                    <a href="/tracking" class="inline-flex justify-center py-2 px-4 border border-neutral-300 shadow-sm text-sm font-medium rounded-md text-neutral-700 bg-white hover:bg-neutral-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 transition">
                        Add Device
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    new TomSelect("#device_id", {
        create: false,
        sortField: {
            field: "text",
            direction: "asc"
        },
        maxOptions: 50, // Limits the visible dropdown items for performance
        plugins: ['dropdown_input'], // Better mobile experience
    });
</script>
{% endblock %}
