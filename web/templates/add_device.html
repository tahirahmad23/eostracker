{% extends "base.html" %}

{% block title %}ADD DEVICE - EOS Tracker{% endblock %}

{% block extra_head %}
<!-- TomSelect CSS for searchable dropdown (overridden for terminal look) -->
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<style>
    /* Override TomSelect to look like a terminal input */
    .ts-wrapper {
        width: 100%;
    }

    .ts-control {
        background: #fff !important;
        border: 1px solid #333 !important;
        border-radius: 4px !important;
        font-family: var(--font-sans) !important;
        padding: 12px !important;
        min-height: 44px !important;
        font-size: 16px !important;
        box-shadow: none !important;
    }

    .ts-wrapper.single .ts-control {
        background: #fff !important;
    }

    .ts-wrapper.focus .ts-control,
    .ts-wrapper.dropdown-active .ts-control {
        border-color: var(--color-primary) !important;
        box-shadow: none !important;
    }

    .ts-control input {
        font-size: 16px !important;
    }

    .ts-dropdown {
        border: 1px solid #333 !important;
        border-radius: 4px !important;
        font-family: var(--font-sans) !important;
        margin-top: 4px !important;
        font-size: 14px !important;
        background: #fff !important;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
    }

    .ts-dropdown .option {
        padding: 8px 12px !important;
    }

    .ts-dropdown .active {
        background-color: #f0f0f0 !important;
        color: #000 !important;
    }

    .ts-dropdown .option:hover {
        background-color: #f9f9f9 !important;
    }

    /* Hide the duplicate wrapper box */
    .ts-wrapper.form-control,
    .ts-wrapper.form-select {
        padding: 0 !important;
        border: none !important;
        background: transparent !important;
    }

    @media (min-width: 1024px) {
        .ts-control {
            font-family: var(--font-mono) !important;
            padding: 8px 12px !important;
            font-size: 14px !important;
            border-radius: 0 !important;
        }

        .ts-control input {
            font-size: 14px !important;
        }

        .ts-dropdown {
            border-radius: 0 !important;
            font-family: var(--font-mono) !important;
            margin-top: 0 !important;
        }
    }
</style>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
{% endblock %}

{% block content %}
<div class="mobile-card"
    style="max-width: 600px; margin: 40px auto; border: 1px solid var(--border-color); padding: 30px; background: #fafafa;">
    <h3 style="border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 25px;">> ADD_DEVICE</h3>

    <form action="/tracking/add" method="POST">
        <div style="margin-bottom: 20px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">SELECT_HARDWARE_MODEL:</label>
            <select id="device_id" name="device_id" required placeholder="START TYPING VENDOR/MODEL...">
                <option value="">[SELECT_DEVICE]...</option>
                {% for device in devices %}
                <option value="{{ device.id }}" {% if selected_device_id==device.id %}selected{% endif %}>
                    {{ device.vendor }} {{ device.model }} (EOS: {{ device.eos_date }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">CUSTOM_NAME
                (OPTIONAL):</label>
            <input type="text" name="custom_name" placeholder="e.g. CORE_ROUTER_01">
        </div>

        <div style="margin-bottom: 25px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">NOTES
                (OPTIONAL):</label>
            <textarea name="notes" rows="3"
                style="width: 100%; border: 1px solid #333; padding: 12px; font-family: var(--font-sans); font-size: 16px; border-radius: 4px; min-height: 100px;"
                placeholder="# RACK_LOCATION: ..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
            <a href="/tracking"
                style="padding: 12px 20px; color: #555; font-family: var(--font-display); font-size: 13px; text-decoration: underline; min-height: 44px; display: inline-flex; align-items: center;">[CANCEL]</a>
            <button type="submit"
                style="background: #333; color: #fff; padding: 12px 20px; border: none; font-family: var(--font-display); font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px;">[
                START_TRACKING ]</button>
        </div>
    </form>
</div>

<script>
    new TomSelect("#device_id", {
        create: false,
        maxOptions: 50,
        plugins: ['dropdown_input'],
    });
</script>
{% endblock %}
