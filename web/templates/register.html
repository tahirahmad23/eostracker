{% extends "base.html" %}

{% block title %}Create Account - EOS Tracker{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-neutral-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white border border-neutral-200 rounded-lg shadow-sm p-8">
            <div class="text-center mb-8">
                <svg class="mx-auto h-12 w-12 text-primary-600" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="4" width="24" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                    <path d="M4 12H28" stroke="currentColor" stroke-width="2"/>
                    <circle cx="10" cy="8" r="1" fill="currentColor"/>
                    <circle cx="14" cy="8" r="1" fill="currentColor"/>
                    <circle cx="18" cy="8" r="1" fill="currentColor"/>
                    <path d="M8 18H24M8 22H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <h2 class="mt-6 text-2xl font-bold text-neutral-900">
                    Create your account
                </h2>
                <p class="mt-2 text-sm text-neutral-600">
                    Already have an account?
                    <a href="/login" class="font-medium text-primary-600 hover:text-primary-700 transition">
                        Sign in
                    </a>
                </p>
            </div>
            
            <form class="space-y-5" action="/register" method="POST">
                <div>
                    <label for="full_name" class="block text-sm font-medium text-neutral-700 mb-1">Full Name</label>
                    <input id="full_name" name="full_name" type="text" required class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition" placeholder="John Doe">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email address</label>
                    <input id="email" name="email" type="email" required class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition" placeholder="engineer@company.com">
                </div>
                
  <div class="relative">
    <label for="password" class="block text-sm font-medium text-neutral-700 mb-1">Password</label>
    <div class="relative">
        <input id="password" name="password" autocomplete="new-password" type="password" required 
            class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition pr-10" 
            placeholder="••••••••">
        <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-400 hover:text-primary-600">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="password-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </button>
    </div>
</div>

<div class="relative">
    <label for="password_confirm" class="block text-sm font-medium text-neutral-700 mb-1">Confirm Password</label>
    <div class="relative">
        <input id="password_confirm" name="password_confirm" autocomplete="new-password" type="password" required 
            class="appearance-none block w-full px-3 py-2 border border-neutral-300 rounded-md shadow-sm placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition pr-10" 
            placeholder="••••••••">
        <button type="button" onclick="togglePassword('password_confirm')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-400 hover:text-primary-600">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="password_confirm-icon">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        </button>
    </div>
</div>

                <div class="flex items-start">
                    <input id="agree_terms" name="agree_terms" type="checkbox" required class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-neutral-300 rounded mt-0.5">
                    <label for="agree_terms" class="ml-2 block text-sm text-neutral-700">
                        I agree to the <a href="/terms" class="text-primary-600 hover:text-primary-700 transition">terms and conditions</a>
                    </label>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition">
                        Create Account
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
    function togglePassword(inputId) {
        const passwordInput = document.getElementById(inputId);
        const icon = document.getElementById(inputId + '-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            // Optional: Change icon to "eye-off"
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            `;
        } else {
            passwordInput.type = 'password';
            // Change icon back to "eye"
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
        }
    }
</script>
{% endblock %}
