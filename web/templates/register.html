{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="mobile-card"
    style="max-width: 400px; margin: 40px auto; border: 1px solid var(--border-color); padding: 30px; background: #fafafa;">
    <h3>> NEW_USER_REGISTRATION</h3>

    {% if error %}
    <div class="sys-log error" style="margin-bottom: 20px;">
        [REG_FAIL]: {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="POST">
        <div style="margin-bottom: 15px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">FULL_NAME:</label>
            <input type="text" name="full_name" id="full_name" required placeholder="John Doe">
        </div>

        <div style="margin-bottom: 15px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">EMAIL_ADDRESS:</label>
            <input type="email" name="email" id="email" required placeholder="engineer@company.com">
        </div>

        <div style="margin-bottom: 15px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">SET_PASSWORD:</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" required autocomplete="new-password" 
                    placeholder="••••••••" style="padding-right: 50px;">
                <button type="button" onclick="togglePassword('password')" 
                    style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 10px; color: #666; min-height: 44px; width: 44px; display: flex; align-items: center; justify-content: center;">
                    <svg style="width: 20px; height: 20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="password-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label class="mono text-sm" style="display: block; margin-bottom: 4px;">CONFIRM_PASSWORD:</label>
            <div style="position: relative;">
                <input type="password" name="password_confirm" id="password_confirm" required autocomplete="new-password" 
                    placeholder="••••••••" style="padding-right: 50px;">
                <button type="button" onclick="togglePassword('password_confirm')" 
                    style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 10px; color: #666; min-height: 44px; width: 44px; display: flex; align-items: center; justify-content: center;">
                    <svg style="width: 20px; height: 20px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="password_confirm-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
        </div>

        <div style="margin-bottom: 20px; display: flex; align-items: start;">
            <input id="agree_terms" name="agree_terms" type="checkbox" required 
                style="width: 20px; height: 20px; margin-right: 8px; flex-shrink: 0; cursor: pointer; margin-top: 2px;">
            <label for="agree_terms" class="mono text-sm" style="margin: 0; line-height: 1.4; cursor: pointer; user-select: none;">
                I agree to the <a href="/terms" style="text-decoration: underline; min-height: 44px; display: inline-flex; align-items: center;">terms and conditions</a>
            </label>
        </div>

        <button type="submit"
            style="width: 100%; background: #333; color: #fff; padding: 14px; border: none; font-family: var(--font-display); font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px;">>
            INITIALIZE_ACCOUNT</button>
    </form>

    <div style="margin-top: 20px; font-size: 12px; text-align: center;" class="mono">
        <a href="/login" style="text-decoration: underline; min-height: 44px; display: inline-flex; align-items: center; padding: 8px;">[RETURN_TO_LOGIN]</a>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const passwordInput = document.getElementById(inputId);
    const icon = document.getElementById(inputId + '-icon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
    } else {
        passwordInput.type = 'password';
        icon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
    }
}
</script>
{% endblock %}
