[pytest]
# Pytest configuration for EOS Tracker

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options (if using pytest-cov)
[coverage:run]
source = database
omit = 
    */tests/*
    */alembic/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
